global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alert-rules.yml]
scrape_configs:
  - job_name: detector
    dns_sd_configs:            # finds every detector replica in compose
      - names: [detector]
        type: A
        port: 8000
  - job_name: producer
    static_configs:
      - targets: ["producer:8001"]
