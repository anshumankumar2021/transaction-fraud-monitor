groups:
  - name: txn-monitor
    rules:
      - alert: AlertRateSpike
        expr: sum(rate(txn_alerts_total[1m])) > 3 * sum(rate(txn_alerts_total[15m] offset 5m))
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Fraud alert rate is 3x its recent baseline"}
      - alert: ConsumerLagHigh
        expr: sum(txn_consumer_lag) > 10000
        for: 2m
        labels: {severity: warn}
        annotations: {summary: "Detector is falling behind the transactions topic"}
      - alert: DeadLettersAppearing
        expr: increase(txn_dead_letter_total[5m]) > 0
        labels: {severity: warn}
        annotations: {summary: "Malformed transactions are being dead-lettered"}
