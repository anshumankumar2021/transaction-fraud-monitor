# Single-node KRaft Kafka for dev clusters (kind / minikube). Use a managed or
# Strimzi-operated cluster with 3+ brokers in production.
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: txn-monitor}
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: txn-monitor}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.txn-monitor.svc.cluster.local:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.txn-monitor.svc.cluster.local:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_NUM_PARTITIONS, value: "6"}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
